[project]
name = "investigerror"
version = "0.1.0"
description = "Evidence-linked investigation of structured webhook incident bundles"
requires-python = ">=3.12"
dependencies = ["anthropic>=1,<2", "pydantic>=2.11,<3", "typer>=0.16,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.17,<2"]

[project.scripts]
investigerror = "investigerror.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investigerror"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
